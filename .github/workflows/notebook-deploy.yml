name: Notebook Deploy

on:
  workflow_call:
    inputs:
      skip_data:
        description: 'Skip make data step'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/data-desk-eco/notebook-runner:latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: yarn --frozen-lockfile

      # same wiring as a laptop: clone data-desk, let its CLI link the repo.
      - name: Setup
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/data-desk
          curl -fsS -L -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/data-desk-eco/data-desk/tarball/main \
            -o /tmp/data-desk.tar.gz || {
              echo "::error::could not read data-desk-eco/data-desk. GH_PAT needs read access to it."
              exit 1
            }
          tar -xz -C /tmp/data-desk --strip-components=1 -f /tmp/data-desk.tar.gz
          /tmp/data-desk/bin/data-desk link

      # Runs whether or not access.conf exists: its absence is how a notebook
      # asks to be published, so gating the step on the file would make deleting
      # it do nothing. The script tells a deleted file apart from one that never
      # existed — notebooks gated by hand before this convention must not be
      # published by their own scheduled deploy — and needs GITHUB_TOKEN to ask
      # GitHub which of the two it is looking at.
      - name: Configure Cloudflare Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping Access config."
            exit 0
          fi
          bash /tmp/data-desk/infra/cf-access.sh

      - name: Authenticate to Google Cloud
        if: ${{ !inputs.skip_data }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "GCP_SA_KEY not set — skipping gcloud auth; notebooks that need provider secrets will fail."
            exit 0
          fi
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp-sa.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa.json --quiet
          rm /tmp/gcp-sa.json

      - name: Run make data
        if: ${{ !inputs.skip_data }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install @anthropic-ai/claude-code
            export PATH="$PWD/node_modules/.bin:$PATH"
          fi
          make data

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d data ] && git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update data and shared files"
          # The checkout is shallow, so the remote main may have advanced (e.g. a
          # concurrent or scheduled deploy) and a plain push fails non-fast-forward
          # ("fetch first"). Rebase onto the latest main and retry so it fast-forwards.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/${GITHUB_REF_NAME:-main} and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || exit 1
          done
          echo "Failed to push after rebasing; giving up." >&2
          exit 1

      - run: make build
      - run: "[ -f favicon.ico ] && cp favicon.ico docs/.observable/dist/ || true"

      # Creating a Pages site needs repository admin, which GITHUB_TOKEN never
      # has however its permissions are set — so configure-pages cannot do it
      # and a new notebook's first deploy dies on "Resource not accessible by
      # integration". `data-desk new` normally turns Pages on at creation, under
      # the operator's own credentials; this is the safety net for a repository
      # made some other way. Whether it can act depends on GH_PAT's scope, so it
      # fails with instructions rather than pretending to have succeeded.
      #
      # The "is it already on?" check has to use GITHUB_TOKEN, not GH_PAT: that
      # token is scoped to the data-desk repository, so it answers 404 for every
      # notebook whether Pages is enabled there or not. GITHUB_TOKEN can always
      # read its own repository's Pages settings under the pages: write grant.
      - name: Enable GitHub Pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # steps here run under sh, not bash: no arrays
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          accept="Accept: application/vnd.github+json"
          seen="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token $GITHUB_TOKEN" -H "$accept" "$api")"
          if [ "$seen" = 200 ]; then
            echo "Pages already enabled for $GITHUB_REPOSITORY."
            exit 0
          fi
          code="$(curl -s -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_PAT" -H "$accept" \
            "$api" -d '{"build_type":"workflow"}')"
          case "$code" in
            201|409) echo "Enabled Pages for $GITHUB_REPOSITORY." ;;
            *)
              cat /tmp/pages.json >&2
              echo "::error::could not enable Pages for $GITHUB_REPOSITORY (HTTP $code). Enable it once from a laptop: gh api repos/$GITHUB_REPOSITORY/pages -X POST -f build_type=workflow. To let CI do this instead, GH_PAT needs administration rights across data-desk-eco, not just read on data-desk."
              exit 1 ;;
          esac

      # enablement is left off: the step above owns it, and configure-pages
      # would only retry the same call with a token that cannot make it.
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.observable/dist
          # per-attempt name: a re-run of a failed run leaves attempt 1's artifact
          # behind, and deploy-pages errors on two artifacts with the same name
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      # pages deployment creation fails transiently ("deployment failed, try again
      # later"), so do: wait out the flake and retry once
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
